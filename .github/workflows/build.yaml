---
name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - versions.env
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Full AzerothCore compiles can take well over an hour per target.
    # GitHub's implicit default (360m) would already cover this, but set
    # explicitly so a runaway build fails clearly with an expected budget
    # instead of relying on an implicit ceiling.
    timeout-minutes: 240
    strategy:
      matrix:
        target:
          - authserver
          - worldserver
          - db-import
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load pins
        run: |
          set -euo pipefail
          source versions.env
          echo "CORE_REPO=${CORE_REPO}" >> "$GITHUB_ENV"
          echo "CORE_REF=${CORE_REF}" >> "$GITHUB_ENV"
          echo "MODULE_REPO=${MODULE_REPO}" >> "$GITHUB_ENV"
          echo "MODULE_REF=${MODULE_REF}" >> "$GITHUB_ENV"
          echo "MODULE2_REPO=${MODULE2_REPO}" >> "$GITHUB_ENV"
          echo "MODULE2_REF=${MODULE2_REF}" >> "$GITHUB_ENV"
          echo "CORE_REF_SHORT=${CORE_REF:0:7}" >> "$GITHUB_ENV"
          echo "MODULE_REF_SHORT=${MODULE_REF:0:7}" >> "$GITHUB_ENV"
          echo "MODULE2_REF_SHORT=${MODULE2_REF:0:7}" >> "$GITHUB_ENV"

      - name: Checkout core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ env.CORE_REF }}
          path: core
          fetch-depth: 0

      - name: Checkout playerbots module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.MODULE_REPO }}
          ref: ${{ env.MODULE_REF }}
          path: core/modules/mod-playerbots

      - name: Checkout multibot-bridge module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.MODULE2_REPO }}
          ref: ${{ env.MODULE2_REF }}
          path: core/modules/mod-multibot-bridge

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Map target to image name
        id: image
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            authserver) name=ac-wotlk-playerbots-authserver ;;
            worldserver) name=ac-wotlk-playerbots-worldserver ;;
            db-import) name=ac-wotlk-playerbots-dbimport ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: core
          file: core/apps/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/woobay/${{ steps.image.outputs.name }}:core-${{ env.CORE_REF_SHORT }}_module-${{ env.MODULE_REF_SHORT }}_mbbridge-${{ env.MODULE2_REF_SHORT }}
            ghcr.io/woobay/${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
